[project]
name = "aca-sandbox-poc"
version = "0.1.0"
description = "Microsoft Agent Framework console agents using Azure Container Apps Sandbox"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "agent-framework-core>=1.13.0",
    "agent-framework-openai>=1.12.0",
    "azure-containerapps-sandbox==0.1.0b4",
    "azure-identity>=1.25.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
